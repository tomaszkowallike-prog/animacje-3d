  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.38) 100%)}
  .lb{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height 1.1s cubic-bezier(.6,0,.2,1);z-index:5}
  .lb.t{top:0}.lb.b{bottom:0}
  body.cine .lb{height:9vh}
  #fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:1;z-index:6}

  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;pointer-events:none;background:linear-gradient(rgba(8,14,24,.55),transparent);z-index:7;transition:opacity .8s}
  body.cine .top{opacity:0}
  .brand{font:700 24px "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .brand span{color:var(--accent)}
  .top .tel{font-size:14px;color:#dfe6ee;text-shadow:0 1px 6px rgba(0,0,0,.5)} .top .tel b{color:#fff}

  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;font:600 15px "Barlow Condensed",Inter,sans-serif;letter-spacing:.04em;color:var(--accent2);background:rgba(10,19,34,.88);border:1.5px solid var(--accent);border-radius:99px;padding:3px 11px;opacity:0;transition:opacity .35s;will-change:transform}
  .lbl.on{opacity:1}
  .lbl.big{font-size:19px;padding:4px 14px;color:#fff;background:var(--accent);border-color:var(--accent)}

  .title{position:fixed;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;z-index:4;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse 60% 45% at 50% 50%,rgba(6,12,22,.55),transparent 75%)}
  .title.on{opacity:1}
  .title .in{transform:translateY(10px);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
  .title.on .in{transform:none}
  .title .k{font:600 14px Inter,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#ffd2ad;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .title h1{font:700 clamp(54px,9vw,128px)/.9 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;margin:.12em 0 .14em;text-shadow:0 4px 30px rgba(0,0,0,.45)}
  .title h1 span{color:var(--accent)}
  .title .s{font-size:clamp(15px,1.6vw,20px);color:#eef2f6;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .title .c{margin-top:22px;display:inline-flex;gap:18px;flex-wrap:wrap;justify-content:center;font:600 clamp(18px,2vw,26px) "Barlow Condensed",Inter,sans-serif;letter-spacing:.04em}
  .title .c span{background:rgba(10,19,34,.72);border:1px solid rgba(255,255,255,.2);padding:6px 16px;border-radius:99px}

  .cap{position:fixed;left:24px;bottom:96px;width:min(430px,calc(100vw - 48px));background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:18px 20px 16px;transition:opacity .45s,transform .45s;z-index:4}
  .cap.swap,.cap.hide{opacity:0;transform:translateY(10px)}
  .eyebrow{display:flex;align-items:center;gap:10px;font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--accent)}
  .cap h2{font:700 38px/1 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;margin:8px 0 8px}
  .cap p{margin:0 0 10px;color:#cfd8e3;font-size:14.5px;line-height:1.5}
  .specs{display:grid;gap:6px;margin:0;padding:0;list-style:none}

 {d:11, cine:2, cam:[[8.5,2.6,11.5,0,2.6,0],[1,1.8,12.5,0,2.7,0],[-8.5,3.2,10.5,0,2.7,0]]},
];
const T=[0];S.forEach(s=>T.push(T[T.length-1]+s.d));const TEND=T[T.length-1];
const sceneAt=t=>{for(let i=S.length-1;i>=0;i--)if(t>=T[i])return i;return 0;};
// catmull-rom curves per scene
S.forEach(s=>{const P=s.cam.map(c=>new THREE.Vector3(c[0],c[1],c[2])),Q=s.cam.map(c=>new THREE.Vector3(c[3],c[4],c[5]));
  s.pc=P.length>2?new THREE.CatmullRomCurve3(P,false,'centripetal'):null;s.qc=Q.length>2?new THREE.CatmullRomCurve3(Q,false,'centripetal'):null;s.P=P;s.Q=Q;});

/* ================= dims & labels setup ================= */
const dW=dim(lad);dW.set([-0.28,0.55,0.07],[0.28,0.55,0.07]);
const d270=dim(lad);d270.set([-0.4,0.27,0.02],[-0.4,0.54,0.02]);
const dHoop=dim(lad);dHoop.set([-CAGE_R,3.3,CAGE_C],[CAGE_R,3.3,CAGE_C]);
const dGap=dim(lad);dGap.set([0.52,3.14,CAGE_C],[0.52,3.78,CAGE_C]);
const dStart=dim(lad);dStart.set([-0.62,0.02,CAGE_C],[-0.62,2.5,CAGE_C]);
const dExit=dim(lad);dExit.set([0.55,WALL_H,0.02],[0.55,TOP,0.02]);
const dBr=dim(lad);

const inS=(i,a=.07,b=.96)=>t=>{if(sceneAt(t)!==i)return false;const u=(t-T[i])/S[i].d;return u>=a&&u<=b;};
label('560 mm',dW.anchor,inS(1,.45),{dy:-24});
label('profil zamknięty 30×50 mm',anchor(lad,RX,1.4,0),inS(1,.5),{dx:100,dy:0});
label('270 mm',d270.anchor,inS(2,.3),{dx:-48,dy:0});
label('szczebel 500 mm',anchor(lad,0,0.81,0),inS(2,.45),{dy:-22});
label('ryflowanie antypoślizgowe',anchor(lad,0.1,1.39,0),inS(3,.15),{dy:-34});
label('2×30×30×30 mm',anchor(lad,-0.12,1.34,0.02),inS(3,.4),{dy:44});
label('nakładka łącząca',anchor(lad,RX+0.02,JOINT_Y+0.12,0),inS(4,.3),{dy:-26});
label('śruby w zestawie',anchor(lad,RX+0.02,JOINT_Y-0.12,0),inS(4,.55),{dy:30});
label('krystaliczna powłoka cynku',anchor(lad,RX,2.75,0.03),inS(5,.04,.24),{dy:-30});
const wLbl=label('☔ deszcz',anchor(lad,0,4.4,0.3),inS(5,.27),{big:true,dy:-30});
const brLbl=label('20 cm',dBr.anchor,inS(6,.12),{big:true,dy:-30});
label('Ø 75 cm',dHoop.anchor,inS(7,.5),{dy:-22});
label('≤ 0,64 m',dGap.anchor,inS(7,.6),{dx:52,dy:0});
label('2,2–3 m',dStart.anchor,inS(7,.4),{dx:-46,dy:0});
label('min. 1,1 m',dExit.anchor,inS(8,.2),{big:true,dx:66,dy:0});
label('pałąki nad attyką',anchor(lad,0,TOP+0.12,-0.25),inS(8,.55),{dy:-30});
label('pokrywa zamykana od dołu',anchor(lad,0,LOCK_Y-0.05,CAGE_C),inS(9,.55),{dy:40});
const vLbl=label('Dom jednorodzinny',anchor(scene,0,WALL_H+1.7,0),inS(10,.05),{big:true});
const dimShow=[[dW,inS(1,.45)],[d270,inS(2,.3)],[dHoop,inS(7,.5)],[dGap,inS(7,.6)],[dStart,inS(7,.4)],[dExit,inS(8,.2)],[dBr,inS(6,.12)]];

/* ================= state from time ================= */
const VNAMES={dom:'Dom jednorodzinny',blok:'Budynek wielorodzinny',hala:'Hala / obiekt przemysłowy'};
const skyBase={turb:4.5,ray:1.4};
function apply(t,dt){
  const k=sceneAt(t);
  // wall distance (scene 6)
  let d=0.20;
  if(t>=T[6]){const v=(t-T[6])/S[6].d;d=0.20+(0.41-0.20)*ease(clamp((v-.2)/.3))+(D_FINAL-0.41)*ease(clamp((v-.64)/.24));}
  const insT=0.15; // facade stays put, only the ladder moves
  lad.position.z=d;ins.scale.z=insT;ins.position.z=insT/2;facade.position.z=insT;
  capFront.scale.z=insT+0.29;capFront.position.z=(insT+0.29)/2-0.27;
  plinth.scale.z=insT+0.012;plinth.position.z=(insT+0.012)/2;
  pipe.position.z=insT+0.07;pipeHead.position.z=insT+0.05;
  const xr=k===6?win((t-T[6])/S[6].d,.05,.97,.08):0;
  const op=1-0.75*xr;M.eps.opacity=op;M.epsFront.opacity=op;M.eps.depthWrite=M.epsFront.depthWrite=op>0.99;
  plinth.visible=op>0.99;

  // rails slide up out of the ground
  const g1=ease(clamp((t-T[1]-0.2)/2.6));
  rails.forEach(r=>{r.visible=g1>0;r.position.y=-TOP*(1-g1);});
  railCaps.forEach(r=>{r.visible=g1>0;r.position.y=TOP*g1+0.003;});
  const fp=back(clamp((t-T[1]-2.6)/.5));feet.forEach(f=>{f.visible=fp>0;f.scale.setScalar(Math.max(1e-4,fp));});
  // brackets
  brackets.forEach((b,i)=>{const s=back(clamp((t-T[1]-3.0-(i>>1)*0.25)/0.6));b.g.visible=s>0;b.g.scale.setScalar(Math.max(1e-4,s));
    const ax=b.sx*ARM_X;
    b.plate.position.set(ax,0,-d+0.004);b.outer.position.set(ax,0,-d+0.008);
    b.inner.position.set(ax+b.sx*0.026*0,0,-d+0.06);b.inner.scale.z=Math.max(0.01,d-0.06-0.012);
    b.ib.forEach((bb,j)=>{bb.position.set(ax,0,-d+0.09+j*0.035);});
    b.clampP.position.set(b.sx*(RX+0.018),0,-0.012);b.cb.forEach(c=>{c.position.x=b.sx*(RX+0.024);c.position.z=-0.012;});});
  // rungs
  rungs.forEach((r,i)=>{const s=clamp((t-T[2]-0.3-i*0.3)/0.45),e=ease(s);r.visible=s>0;r.position.y=RUNG_Y[i]+(1-e)*0.35;r.position.z=(1-e)*0.5;r.rotation.y=(1-e)*0.9;});
  // joints
  joints.forEach(j=>{const s=ease(clamp((t-T[4]-0.4)/1.0));const sx=j.userData.sx;j.visible=s>0;j.position.set(sx*(RX+0.018+(1-s)*0.35),JOINT_Y,0);
    j.userData.bolts.forEach((b,bi)=>{const bs=back(clamp((t-T[4]-1.5-bi*0.2)/0.35));b.visible=bs>0;b.scale.setScalar(Math.max(1e-4,bs));});});
  // cage
  hoops.forEach((h,i)=>{const s=back(clamp((t-T[7]-0.5-i*0.45)/0.6));h.visible=s>0;h.scale.setScalar(Math.max(1e-4,s));});
  const bs=ease(clamp((t-T[7]-2.9)/1.4));bars.forEach(b=>{b.visible=bs>0;b.scale.y=Math.max(1e-4,BAR_L*bs);});
  // goosenecks
  const gs=ease(clamp((t-T[8]-0.6)/2.2));
  goose.forEach(m=>{m.visible=gs>0;m.geometry.setDrawRange(0,Math.floor(m.userData.count*gs/6)*6);});
  const gf=back(clamp((t-T[8]-2.8)/0.4));gooseFeet.forEach(f=>{f.visible=gf>0;f.scale.setScalar(Math.max(1e-4,gf));});
  const gb=back(clamp((t-T[8]-3.1)/0.5));gooseBar.visible=gb>0;gooseBar.scale.set(Math.max(1e-4,gb),1,1);
  // lock
  const la=clamp((t-T[9]-0.2)/0.5);lockPivot.visible=la>0;lockLug.visible=la>0;lockPivot.scale.setScalar(Math.max(1e-4,back(la)));
  lockPivot.rotation.x=lerp(-Math.PI/2+0.06,0,ease(clamp((t-T[9]-1.2)/1.6)));
  const pl=back(clamp((t-T[9]-3.0)/0.5));padlock.visible=pl>0;padlock.scale.setScalar(Math.max(1e-4,pl));

  // variants
  let v='dom';
  if(k===10){const u=(t-T[10])/S[10].d;v=u<.34?'dom':u<.67?'blok':'hala';}
  curVar=v;
  for(const n in V){V[n].visible=n===v;R[n].visible=n===v;}
  M.plaster.color.lerp(VARC[v],dt>0?clamp(dt*5):1);M.epsFront.color.copy(M.plaster.color);M.plasterSide.color.copy(M.plaster.color);
  vLbl.el.textContent=VNAMES[v];

  // weather & light
  let rainA=0,snowA=0,uvA=0;
  if(k===5){const u=(t-T[5])/S[5].d;rainA=win(u,.26,.5);snowA=win(u,.5,.74);uvA=win(u,.74,1.01);
    wLbl.el.textContent=u<.5?'☔ deszcz':u<.74?'❄ śnieg i mróz':'☀ promieniowanie UV';
    glint.intensity=u<.26?3:0;glint.position.set(RX+0.25,2.5+Math.sin(t*1.3)*0.5,d+0.35);}
  else glint.intensity=0;
  rain.material.opacity=rainA*.5;snow.material.opacity=snowA;rain.visible=rainA>0;snow.visible=snowA>0;
  if(rainA>0){for(let i=0;i<RAIN_N;i++){const [x,z,s]=rainSeed[i];const y=8-((s*8+t*9)%8);const o=i*6;rainPos[o]=x;rainPos[o+1]=y;rainPos[o+2]=z;rainPos[o+3]=x-0.02;rainPos[o+4]=y+0.3;rainPos[o+5]=z;}rainGeo.attributes.position.needsUpdate=true;}
  if(snowA>0){for(let i=0;i<SNOW_N;i++){const [x,z,s]=snowSeed[i];const o=i*3;snowPos[o]=x+Math.sin(t*1.2+s*20)*0.15;snowPos[o+1]=8-((s*8+t*0.7)%8);snowPos[o+2]=z;}snowGeo.attributes.position.needsUpdate=true;}
  const dull=Math.max(rainA,snowA);
  // golden hour at the end
  const gold=k===12?smoother(clamp((t-T[12])/7)):0;
  setSun(lerp(34,7,gold)-dull*6,lerp(38,62,gold));
  SU.turbidity.value=lerp(4.5,8,gold)+dull*6;SU.rayleigh.value=lerp(1.4,2.6,gold)+dull*1.5;
  sun.intensity=(3.4-2.6*dull+1.2*uvA)*lerp(1,0.85,gold);
  sun.color.setRGB(1,lerp(0.95,0.72,gold)-0.05*uvA,lerp(0.87,0.5,gold)-0.15*uvA);
  hemi.intensity=lerp(0.7,0.4,gold)-0.2*dull;
  scene.fog.color.setRGB(lerp(.77,.86,gold)-.15*dull,lerp(.82,.68,gold)-.12*dull,lerp(.87,.55,gold)-.08*dull);
  renderer.toneMappingExposure=0.66-0.08*dull+0.04*uvA;

  // dims
  dBr.set([0.42,BR_Y[1],-d],[0.42,BR_Y[1],0]);
  const cm=Math.round(d*100);brLbl.el.textContent=`${cm} cm · zakres ${cm<26?'16–26':cm<36?'26–36':'36–46'} cm`;
  dimShow.forEach(([o,f])=>{o.target=f(t)?1:0;o.mat.opacity=lerp(o.mat.opacity,o.target,dt>0?clamp(dt*7):1);o.g.visible=o.mat.opacity>0.01;});

  // overlays
  const live=$('#live');
  live.textContent=k===6?`Odległość od ściany: ${cm} cm`:k===10?'▸ '+VNAMES[v]:'';
  const u0=(t-T[0])/S[0].d;$('#tIntro').classList.toggle('on',k===0&&u0>.18&&u0<.82);
  const u12=(t-T[12])/S[12].d;$('#tEnd').classList.toggle('on',k===12&&u12>.3);
  document.body.classList.toggle('cine',!!S[k].cine);
  $('#cap').classList.toggle('hide',!!S[k].cine);
  $('#fade').style.opacity=Math.max(clamp(1-t/1.2),clamp((t-(TEND-1.0))/1.0)).toFixed(3);
}
let curVar='dom';

/* ================= camera ================= */
const P0=new THREE.Vector3(),P1=new THREE.Vector3(),T0=new THREE.Vector3(),T1=new THREE.Vector3();
function camPose(i,u,outP,outT){const s=S[i];const e=ease(clamp(u));
  if(s.pc){s.pc.getPoint(e,outP);s.qc.getPoint(e,outT);}else{outP.lerpVectors(s.P[0],s.P[1],e);outT.lerpVectors(s.Q[0],s.Q[1],e);}}
function cameraPose(t){const i=sceneAt(t),u=(t-T[i])/S[i].d;camPose(i,u,P0,T0);
  const bl=Math.min(2.2,S[i].d*0.4);if(i>0&&t-T[i]<bl){camPose(i-1,1,P1,T1);const k=smoother((t-T[i])/bl);P0.lerpVectors(P1,P0,k);T0.lerpVectors(T1,T0,k);}
  // subtle handheld drift
  const dist=P0.distanceTo(T0),a=0.006*dist;
  P0.x+=Math.sin(t*0.53)*a;P0.y+=Math.sin(t*0.71+1.3)*a*0.7;T0.x+=Math.sin(t*0.37+2.1)*a*0.4;
  return T0;}
/* smooth wheel zoom (from repo version) */
const wheelDelta=e=>{let d=e.deltaY;if(e.deltaMode===1)d*=16;else if(e.deltaMode===2)d*=innerHeight;return Math.max(-120,Math.min(120,d));};
let zK=1,zT=1,baseDist=10;
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zT=Math.max(0.3,Math.min(2.2,zT*Math.exp(wheelDelta(e)*0.0012)));},{passive:false});
/* keep the camera outside the building (box + margin) */
const BLD={x0:-4.17,x1:4.17,y1:WALL_H+0.05,z0:-6.17,z1:0.15+0.05},CM=0.25;
function keepOut(v){const x0=BLD.x0-CM,x1=BLD.x1+CM,y1=BLD.y1+CM,z0=BLD.z0-CM,z1=BLD.z1+CM;
  if(v.x>x0&&v.x<x1&&v.y<y1&&v.z>z0&&v.z<z1){
    const pen=[[v.x-x0,'x',x0],[x1-v.x,'x',x1],[y1-v.y,'y',y1],[v.z-z0,'z',z0],[z1-v.z,'z',z1]].sort((a,b)=>a[0]-b[0])[0];
    v[pen[1]]=pen[2];}
  if(v.y<0.35)v.y=0.35;return v;}
function placeCamera(t){cameraPose(t);baseDist=P0.distanceTo(T0);P0.sub(T0).multiplyScalar(zK).add(T0);keepOut(P0);camera.position.copy(P0);camera.lookAt(T0);return T0;}

/* ================= UI ================= */
const track=$('#track');
const segs=S.map((s,i)=>{const d=document.createElement('div');d.className='seg';d.style.flex=s.d;d.innerHTML='<i></i>';d.title=s.e||(i?'Finał':'Intro');track.appendChild(d);return d;});
let t=0,playing=true,lastScene=-1,dragging=false;
const playBtn=$('#play');
const ICON_PAUSE='<svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 20 20"><path d="M5 3 L17 10 L5 17 Z" fill="currentColor"/></svg>';
function setPlaying(p){playing=p;playBtn.innerHTML=p?ICON_PAUSE:ICON_PLAY;playBtn.setAttribute('aria-label',p?'Pauza':'Odtwórz');
  controls.enabled=!p;$('#hint').style.opacity=p?0:1;if(!p){controls.target.copy(placeCamera(t));controls.update();}}
playBtn.onclick=()=>setPlaying(!playing);
renderer.domElement.addEventListener('pointerdown',()=>{if(playing)setPlaying(false);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}});
function seek(e){const r=track.getBoundingClientRect();t=clamp((e.clientX-r.left)/r.width)*TEND*0.9999;}
track.addEventListener('pointerdown',e=>{dragging=true;track.setPointerCapture(e.pointerId);seek(e);});
track.addEventListener('pointermove',e=>{if(dragging)seek(e);});
track.addEventListener('pointerup',()=>{dragging=false;if(!playing){controls.target.copy(placeCamera(t));}});
function updateCaption(){const c=$('#cap');c.classList.add('swap');
  setTimeout(()=>{const s=S[lastScene];if(s.e){$('#capE').textContent=s.e;$('#capT').textContent=s.t;$('#capP').textContent=s.p;
    $('#capS').innerHTML=s.s.map(([a,b])=>`<li><span>${a}</span><b>${b}</b></li>`).join('');}c.classList.remove('swap');},260);}
const mm=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* ================= voice-over (synced to the timeline) ================= */
const vo=$('#vo'),sndBtn=$('#snd');let soundOn=false;
const ICON_ON='<svg viewBox="0 0 20 20"><path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor"/><path d="M13 7c1.3 1.6 1.3 4.4 0 6M15.5 5c2.4 2.8 2.4 7.2 0 10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
const ICON_OFF='<svg viewBox="0 0 20 20"><path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor"/><path d="M13 8l4 4M17 8l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function setSound(on){soundOn=on;sndBtn.classList.toggle('off',!on);$('#sndI').innerHTML=on?ICON_ON:ICON_OFF;$('#sndL').textContent=on?'Lektor':'Włącz lektora';
  sndBtn.setAttribute('aria-label',on?'Wycisz lektora':'Włącz lektora');if(!on)vo.pause();}
sndBtn.onclick=()=>{const on=!soundOn;setSound(on);if(on){vo.currentTime=Math.min(t,vo.duration||t);vo.play().catch(()=>setSound(false));if(!playing)setPlaying(true);}};
setSound(false);
function syncVO(){if(!soundOn)return;
  const want=playing&&!dragging;
  if(!want){if(!vo.paused)vo.pause();return;}
  const dur=vo.duration||0;
  if(t>=dur-0.05){if(!vo.paused)vo.pause();return;}
  if(Math.abs(vo.currentTime-t)>0.3)vo.currentTime=t;
  if(vo.paused)vo.play().catch(()=>{});}

/* ================= resize / loop ================= */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;
  camera.fov=w/h<1?Math.min(66,38/(w/h)*0.72):38;
  if(w>900){const off=Math.min(220,w*0.13);camera.setViewOffset(w,h,-off,0,w,h);}else if(w/h<1){camera.setViewOffset(w,h,0,h*0.17,w,h);}else camera.clearViewOffset();
  camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const v3=new THREE.Vector3();
function placeLabels(){const w=innerWidth,h=innerHeight;
  labels.forEach(L=>{const on=L.show(t);L.el.classList.toggle('on',on);if(!on)return;
    L.obj.getWorldPosition(v3);v3.project(camera);if(v3.z>1){L.el.classList.remove('on');return;}
    L.el.style.transform=`translate(${(v3.x+1)/2*w+L.dx}px,${(1-v3.y)/2*h+L.dy}px) translate(-50%,-50%)`;});}

const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.1);
  if(playing&&!dragging){t+=dt;if(t>=TEND)t=0;}
  zK+=(zT-zK)*(1-Math.exp(-dt*7));
  apply(t,dt);
  if(playing||dragging){const tg=placeCamera(t);if(!playing)controls.target.copy(tg);}
  else{controls.update();const off=camera.position.clone().sub(controls.target);off.setLength(Math.max(1,baseDist*zK));camera.position.copy(controls.target).add(off);keepOut(camera.position);}
  const i=sceneAt(t);if(i!==lastScene){lastScene=i;updateCaption();}
  segs.forEach((s,j)=>{s.firstChild.style.width=(clamp((t-T[j])/S[j].d)*100)+'%';s.classList.toggle('cur',j===i);});
  $('#metaL').innerHTML=`<b>${S[i].e||(i?'Finał':'Intro')}</b>`;$('#metaR').textContent=`${mm(t)} / ${mm(TEND)}`;
  renderer.render(scene,camera);placeLabels();syncVO();}
setPlaying(true);apply(0,0);placeCamera(0);
window.__seek=s=>{t=s;};
frame();
</script>
