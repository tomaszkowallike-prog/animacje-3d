<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocieplenie elewacji — krok po kroku</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a33;--muted:#6b7680;--line:#e3e1dc;--accent:#e46f1f;--accent-soft:#fdebdc;--bg:#f6f4f0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 40% 35%,#ffffff 0%,#f6f4f0 55%,#ece9e3 100%)}
canvas{display:block}
#stage{position:fixed;inset:0;right:340px}
#panel{position:fixed;top:0;right:0;bottom:0;width:340px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-left:1px solid var(--line);padding:22px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
ol.steps li .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid #d6d2ca;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#fff}
ol.steps li.done{color:var(--ink)}
ol.steps li.done .n{background:var(--ink);border-color:var(--ink);color:#fff}
ol.steps li.cur{background:var(--accent-soft);color:var(--ink);font-weight:600}
ol.steps li.cur .n{background:var(--accent);border-color:var(--accent);color:#fff}
ol.steps li:hover{background:#f3f1ec}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
#xsec svg{width:100%;height:auto;display:block}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d6d2ca;cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--accent)}
.seg{display:flex;background:#efece6;border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 8px;font:600 12px Inter;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#cap{position:fixed;left:24px;top:22px;max-width:min(520px,calc(100vw - 400px));pointer-events:none}
#cap .k{font:800 12px Inter;letter-spacing:.14em;color:var(--accent)}
#cap .t{font:800 clamp(20px,2.4vw,28px) Inter;letter-spacing:-.02em;margin-top:4px}
#cap .d{font-size:14.5px;line-height:1.5;color:#45525c;margin-top:8px;background:rgba(255,255,255,.75);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
#legend{position:fixed;left:24px;bottom:84px;display:none;align-items:center;gap:8px;font:600 11px Inter;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#legend i{display:block;width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,#1b1f6b,#5b2fa0,#c2357b,#ef6a2a,#ffd23f,#fffbe0)}
#bar{position:fixed;left:24px;right:364px;bottom:22px;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
#bar button{border:1px solid var(--line);background:#fff;border-radius:8px;font:600 12px Inter;padding:6px 10px;cursor:pointer;color:var(--ink)}
#bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#scrub{flex:1;accent-color:var(--accent)}
@media (max-width:860px){
  #stage{right:0;bottom:46vh}
  #panel{top:auto;height:46vh;width:100%;border-left:0;border-top:1px solid var(--line);padding:14px 16px}
  #cap{max-width:calc(100vw - 32px);left:16px;top:12px}
  #cap .d{font-size:13px;padding:8px 10px}
  #bar{left:12px;right:12px;bottom:calc(46vh + 10px)}
  #legend{bottom:calc(46vh + 64px);left:12px}
  ol.steps li{padding:5px 6px}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="cap"><div class="k" id="capk"></div><div class="t" id="capt"></div><div class="d" id="capd"></div></div>
<div id="legend">zimno <i></i> ciepło · ilustracja</div>
<aside id="panel">
  <div><h1>Ocieplenie elewacji</h1><div class="sub">System ETICS — styropian lub wełna, klej, łączniki, siatka, tynk</div></div>
  <div><div class="lbl">ETAPY PRAC</div><ol class="steps" id="steps"></ol></div>
  <div id="xsec"><div class="lbl">PRZEKRÓJ ŚCIANY</div><svg id="xs" viewBox="0 0 300 150"></svg></div>
  <div><div class="lbl">KOLOR TYNKU</div><div class="sw" id="sw"></div></div>
  <div><div class="lbl">FAKTURA</div><div class="seg" id="tex"><button class="on" data-t="baranek">Baranek 1,5 mm</button><button data-t="kornik">Kornik 2,0 mm</button></div></div>
</aside>
<div id="bar">
  <button id="play" class="on">❚❚</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Oś czasu">
  <button data-s="0.5">½×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';

const PI = Math.PI;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, b) => ease((t - a) / (b - a));

const easeOutBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

/* ---------- renderer ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(34, 1, 0.5, 400);
camera.position.set(0, 9, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enableZoom = false; controls.enablePan = false;
controls.minPolarAngle = 0.5; controls.maxPolarAngle = 1.45;
let userZoom = 1;
const wheelDelta = e => { let d = e.deltaY; if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= innerHeight; return Math.max(-120, Math.min(120, d)); };
let zoomTarget = 1;
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); zoomTarget = clamp(zoomTarget * Math.exp(wheelDelta(e) * 0.0012), 0.5, 1.8); }, { passive: false });
scene.add(new THREE.HemisphereLight(0xffffff, 0xe9e4da, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.2);
sun.position.set(14, 22, 16); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -16; sun.shadow.camera.right = 16; sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16; sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun);
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

const house = new THREE.Group(); scene.add(house);

/* ---------- helpers ---------- */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const rnd = (() => { let s = 12345; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function rectShape(u0, u1, v0, v1, holes = []) {
  const s = new THREE.Shape(); s.moveTo(u0, v0);
  holes.filter(o => o.v0 <= v0 + 1e-3).sort((a, b) => a.u0 - b.u0).forEach(o => { s.lineTo(o.u0, v0); s.lineTo(o.u0, o.v1); s.lineTo(o.u1, o.v1); s.lineTo(o.u1, v0); });
  s.lineTo(u1, v0); s.lineTo(u1, v1); s.lineTo(u0, v1); s.closePath();
  holes.filter(o => o.v0 > v0 + 1e-3).forEach(o => { const p = new THREE.Path(); p.moveTo(o.u0, o.v0); p.lineTo(o.u0, o.v1); p.lineTo(o.u1, o.v1); p.lineTo(o.u1, o.v0); p.closePath(); s.holes.push(p); });
  return s;
}
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent && parent.add(m); return m; }

/* ---------- dimensions ---------- */
const W = 10, D = 8, H = 6, T = 0.2, BASE = 0.3; // T = exaggerated insulation thickness
const WALLS = [
  { id: 'front', origin: new THREE.Vector3(0, 0, D / 2), u: new THREE.Vector3(1, 0, 0), n: new THREE.Vector3(0, 0, 1), u0: -W / 2, u1: W / 2,
    openings: [
      { u0: -3.6, u1: -2.5, v0: 0, v1: 2.2, door: true },
      { u0: -0.3, u1: 1.3, v0: 0.9, v1: 2.3 }, { u0: 2.4, u1: 4.0, v0: 0.9, v1: 2.3 },
      { u0: -3.8, u1: -2.3, v0: 3.9, v1: 5.2 }, { u0: -0.3, u1: 1.3, v0: 3.9, v1: 5.2 }, { u0: 2.4, u1: 4.0, v0: 3.9, v1: 5.2 }] },
  { id: 'side', origin: new THREE.Vector3(W / 2, 0, 0), u: new THREE.Vector3(0, 0, -1), n: new THREE.Vector3(1, 0, 0), u0: -D / 2, u1: D / 2,
    openings: [{ u0: -0.9, u1: 0.9, v0: 0.9, v1: 2.3 }, { u0: -2.8, u1: -1.4, v0: 3.9, v1: 5.2 }, { u0: 1.2, u1: 2.6, v0: 3.9, v1: 5.2 }] },
];
// local frame for each wall: x = along wall, y = up, z = outward normal
WALLS.forEach(w => {
  w.g = new THREE.Group(); w.g.position.copy(w.origin);
  w.g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(w.u, new THREE.Vector3(0, 1, 0), w.n));
  house.add(w.g);
});

/* ================= TEXTURES ================= */
const blockTex = canvasTex(1024, 512, (g, w, h) => { // 2 m × 1 m of masonry
  g.fillStyle = '#9a6a52'; g.fillRect(0, 0, w, h);
  const bw = w / 4, bh = h / 4;
  for (let r = 0; r < 4; r++) for (let c = -1; c < 5; c++) {
    const x = c * bw + (r % 2) * bw / 2, y = r * bh;
    const l = rnd() * 18; g.fillStyle = `rgb(${190 + l},${118 + l},${82 + l})`; g.fillRect(x + 4, y + 4, bw - 8, bh - 8);
    for (let k = 0; k < 120; k++) { g.fillStyle = `rgba(90,80,70,${rnd() * 0.12})`; g.fillRect(x + 4 + rnd() * (bw - 10), y + 4 + rnd() * (bh - 10), 2, 2); }
  }
});
blockTex.wrapS = blockTex.wrapT = THREE.RepeatWrapping; blockTex.repeat.set(0.5, 1);
const epsTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#f7f7f3'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) { const r = 1 + rnd() * 2.2; g.strokeStyle = `rgba(150,150,140,${0.12 + rnd() * 0.12})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, r, 0, 2 * PI); g.stroke(); }
  g.strokeStyle = 'rgba(120,120,110,.35)'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
});
const glueTex = canvasTex(256, 128, (g, w, h) => { // back of board: perimeter bead + dabs
  g.fillStyle = '#f2f2ee'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#9b978f'; g.lineWidth = 16; g.lineJoin = 'round'; g.strokeRect(18, 18, w - 36, h - 36);
  g.fillStyle = '#9b978f';
  [[w * .3, h * .5], [w * .5, h * .5], [w * .7, h * .5]].forEach(([x, y]) => { g.beginPath(); g.ellipse(x, y, 20, 18, 0, 0, 2 * PI); g.fill(); });
});
function meshTex(color, alpha) {
  const t = canvasTex(256, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.strokeStyle = color; g.lineWidth = 3; g.globalAlpha = alpha;
    for (let i = 0; i <= w; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const meshGrid = meshTex('#e8b23a', 1); meshGrid.repeat.set(4, 4);
const reinfTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#cfccc5'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '255,255,255' : '90,90,90'},${rnd() * 0.08})`; g.fillRect(rnd() * w, rnd() * h, 3, 3); }
  g.strokeStyle = 'rgba(214,160,60,.35)'; g.lineWidth = 2;
  for (let i = 0; i <= w; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
});
reinfTex.wrapS = reinfTex.wrapT = THREE.RepeatWrapping; reinfTex.repeat.set(1, 1);
function plasterTex(kind) {
  const t = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#f2f2f2'; g.fillRect(0, 0, w, h);
    if (kind === 'baranek') {
      for (let i = 0; i < 26000; i++) { const x = rnd() * w, y = rnd() * h, r = 1 + rnd() * 1.8; g.fillStyle = `rgba(255,255,255,${0.5 + rnd() * .5})`; g.beginPath(); g.arc(x, y, r, 0, 2 * PI); g.fill(); g.fillStyle = `rgba(0,0,0,${0.08 + rnd() * .1})`; g.beginPath(); g.arc(x + r * .6, y + r * .6, r * .7, 0, 2 * PI); g.fill(); }
    } else {
      for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(0,0,0,${rnd() * 0.05})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
      for (let i = 0; i < 1600; i++) {
        const x = rnd() * w, y = rnd() * h, a = rnd() * 2 * PI, L = 6 + rnd() * 14;
        g.strokeStyle = `rgba(0,0,0,${0.18 + rnd() * .14})`; g.lineWidth = 1.6 + rnd(); g.beginPath(); g.moveTo(x, y);
        g.quadraticCurveTo(x + Math.cos(a + .6) * L * .6, y + Math.sin(a + .6) * L * .6, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x + 1, y + 1); g.lineTo(x + Math.cos(a) * L + 1, y + Math.sin(a) * L + 1); g.stroke();
      }
    }
  });

}
const PLASTER = { baranek: plasterTex('baranek'), kornik: plasterTex('kornik') };
function thermalTex(w, before) {
  const span = w.u1 - w.u0 + T, ppm = 64;
  const t = canvasTex(Math.round(span * ppm), Math.round(H * ppm), (g, cw, ch) => {
    const X = u => (u - w.u0) * ppm, Y = v => (H - v) * ppm;
    const grd = g.createLinearGradient(0, 0, 0, ch);
    if (before) { grd.addColorStop(0, '#f08a2a'); grd.addColorStop(.5, '#d94a3a'); grd.addColorStop(1, '#c2357b'); }
    else { grd.addColorStop(0, '#3a2c8e'); grd.addColorStop(1, '#1b1f6b'); }
    g.fillStyle = grd; g.fillRect(0, 0, cw, ch);
    const blob = (x, y, r, c) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r); };

/* ================= MATERIALS ================= */
const M = {
  wall: new THREE.MeshStandardMaterial({ map: blockTex, roughness: 0.95 }),
  plinth: new THREE.MeshStandardMaterial({ color: 0x8d8a84, roughness: 0.9 }),
  roof: new THREE.MeshStandardMaterial({ color: 0x4a4f55, roughness: 0.75 }),
  fascia: new THREE.MeshStandardMaterial({ color: 0x3b3f44, roughness: 0.6 }),
  frame: new THREE.MeshStandardMaterial({ color: 0xf4f4f2, roughness: 0.4 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x9fb7c4, roughness: 0.05, metalness: 0.6 }),
  door: new THREE.MeshStandardMaterial({ color: 0x6b4a33, roughness: 0.6 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xb9bdc1, roughness: 0.35, metalness: 0.9 }),
  gutter: new THREE.MeshStandardMaterial({ color: 0x5a5f65, roughness: 0.4, metalness: 0.5 }),
  eps: [null, null, null, null, null, null],
  dowel: new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.5 }),
  pull: new THREE.MeshStandardMaterial({ color: 0xf7f7f3, roughness: 0.8 }),
  scaff: new THREE.MeshStandardMaterial({ color: 0xa8b0b8, roughness: 0.4, metalness: 0.7 }),
  plank: new THREE.MeshStandardMaterial({ color: 0xc89a5e, roughness: 0.8 }),
  ground: new THREE.MeshStandardMaterial({ color: 0xece9e2, roughness: 1 }),
  path: new THREE.MeshStandardMaterial({ color: 0xd9d4ca, roughness: 1 }),
  strip: new THREE.MeshStandardMaterial({ map: meshGrid, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide, roughness: 0.7 }),
};
const epsSide = new THREE.MeshStandardMaterial({ color: 0xeeeee8, roughness: 0.9 });
const epsFront = new THREE.MeshStandardMaterial({ map: epsTex, roughness: 0.9 });
const epsBack = new THREE.MeshStandardMaterial({ map: glueTex, roughness: 0.95 });
M.eps = [epsSide, epsSide, epsSide, epsSide, epsFront, epsBack];

// sweep planes (top-down reveal) — world-space y clipping
const sweep = { primer: new THREE.Plane(new THREE.Vector3(0, 1, 0), -99), reinf: new THREE.Plane(new THREE.Vector3(0, 1, 0), -99), plaster: new THREE.Plane(new THREE.Vector3(0, 1, 0), -99) };
const coatMat = {
  primer: new THREE.MeshStandardMaterial({ color: 0x8fa3b8, transparent: true, opacity: 0.28, roughness: 0.6, clippingPlanes: [sweep.primer], depthWrite: false }),
  reinf: new THREE.MeshStandardMaterial({ map: reinfTex, roughness: 0.9, clippingPlanes: [sweep.reinf] }),
  plaster: new THREE.MeshStandardMaterial({ color: 0xe8dcc4, map: PLASTER.baranek, bumpMap: PLASTER.baranek, bumpScale: 1.2, roughness: 0.95, clippingPlanes: [sweep.plaster] }),
};

const revealPl = new THREE.MeshStandardMaterial({ color: 0xe8dcc4, map: PLASTER.baranek, roughness: 0.95 });
/* ================= GROUND & CORE ================= */
mesh(new THREE.CircleGeometry(40, 64).rotateX(-PI / 2), M.ground, scene).castShadow = false;
mesh(new THREE.BoxGeometry(1.6, 0.04, 6).translate(0, 0.02, 0), M.path, house, -3.05, 0, D / 2 + 3);
// back/left walls (simple) + roof
mesh(new THREE.BoxGeometry(W, H, 0.35), M.wall, house, 0, H / 2, -D / 2 + 0.175);
mesh(new THREE.BoxGeometry(0.35, H, D), M.wall, house, -W / 2 + 0.175, H / 2, 0);

function subtract(r, o) {
  if (o.u1 <= r.u0 || o.u0 >= r.u1 || o.v1 <= r.v0 || o.v0 >= r.v1) return [r];
  const out = [];
  if (o.u0 > r.u0) out.push({ u0: r.u0, u1: o.u0, v0: r.v0, v1: r.v1 });
  if (o.u1 < r.u1) out.push({ u0: o.u1, u1: r.u1, v0: r.v0, v1: r.v1 });
  const a = Math.max(r.u0, o.u0), b = Math.min(r.u1, o.u1);
  if (o.v0 > r.v0) out.push({ u0: a, u1: b, v0: r.v0, v1: o.v0 });
  if (o.v1 < r.v1) out.push({ u0: a, u1: b, v0: o.v1, v1: r.v1 });
  return out;
}

  scaff.scale.y = Math.max(0.001, sc); scaff.visible = sc > 0.01;
  // removed items (old sills, downpipe) and new ones
  const rem = ramp(t, 6.8, 7.8);
  removable.forEach(m => { m.visible = rem < 0.99; m.position.y = (m.userData.y0 ??= m.position.y) + rem * 0.4; m.scale.setScalar(1 - rem * 0.999); });
  const fin = ramp(t, 34, 35);
  finals.forEach(m => { m.visible = fin > 0.01; m.scale.setScalar(Math.max(0.001, fin)); });

  // primer sweep
  const yP = H + 0.3 - (H + 0.6) * lin(t, 8.3, 10.8);
  sweep.primer.constant = -yP;
  WALLS.forEach(w => { w.revEps.visible = t > 21 && t < 33.5; w.revPl.visible = t >= 33.4; });
  // pull test
  pulls.forEach((p, i) => {
    const a = ramp(t, 11.2 + i * 0.15, 11.6 + i * 0.15), tear = ramp(t, 12.8 + i * 0.12, 13.4 + i * 0.12);
    p.g.visible = t > 11.1 && t < 22;
    p.blk.scale.setScalar(Math.max(0.001, a)); p.blk.position.z = tear * 1.2; p.blk.rotation.x = tear * 0.9;
    p.blk.visible = tear < 0.98; p.res.visible = tear > 0.05;
  });
  // starter profile
  const sp = ramp(t, 14.2, 15.3);
  WALLS.forEach(w => { w.starter.scale.x = Math.max(0.001, sp); w.starter.visible = sp > 0.01; });
  // boards
  boards.forEach(b => {
    const st = 15.6 + b.order / maxOrder * 7.6, k = clamp((t - st) / 0.55);
    b.pivot.visible = k > 0;
    if (k <= 0) return;
    const e = easeOutBack(k);
    b.pivot.position.set(b.home.x, b.home.y + (1 - e) * 0.6, b.home.z + (1 - ease(k)) * 2.2);
    b.pivot.rotation.y = (1 - ease(clamp(k * 1.25))) * PI; // shows glue pattern, then flips onto the wall
  });
  // dowels
  dowels.forEach(d => { const k = clamp((t - 24.2 - d.order / dowels.length * 1.8) / 0.25); d.d.scale.setScalar(Math.max(0.001, easeOutBack(k))); });
  // mesh strips + reinforcement sweep
  WALLS.forEach(w => w.strips.forEach((s, i) => s.scale.setScalar(Math.max(0.001, ramp(t, 26.6 + i * 0.03, 27.0 + i * 0.03)))));
  const yR = H + 0.3 - (H + 0.6) * lin(t, 27.4, 30.2);
  sweep.reinf.constant = -yR;
  // plaster sweep
  const yT = H + 0.3 - (H + 0.6) * lin(t, 30.8, 33.4);
  sweep.plaster.constant = -yT;
  // tool follows active sweep
  let ty2 = null;
  if (t > 8.3 && t < 10.8) ty2 = yP; else if (t > 27.4 && t < 30.2) ty2 = yR; else if (t > 30.8 && t < 33.4) ty2 = yT;
  tool.visible = ty2 != null && ty2 > BASE && ty2 < H;
  if (tool.visible) {
    const wf = WALLS[0], zz = t < 11 ? 0.06 : T + 0.05;
    _v.set(Math.sin(t * 5) * 3.6, ty2, zz); wf.g.localToWorld(_v); tool.position.copy(_v); tool.quaternion.copy(house.quaternion); tool.rotation.z = 0;
  }
  // captions
  let s = null; for (const q of STEPS) if (t >= q.t) s = q;
  if (!s) s = { k: 'START', title: 'Dom przed ociepleniem', d: 'Ściany z bloczków, bez izolacji. Zobacz, jak wygląda ocieplenie metodą lekką-mokrą (ETICS), krok po kroku.', layer: -1 };
  if (s !== lastStep) {
    lastStep = s; capk.textContent = s.k; capt.textContent = s.title; capd.textContent = s.d;
    const idx = LIST.indexOf(s), cur = idx >= 0 ? idx : (s.k === 'GOTOWE' || s.k === 'PO' ? 99 : -1);
    [...stepsEl.children].forEach((li, i) => { li.classList.toggle('cur', i === idx); li.classList.toggle('done', i < cur && i !== idx); });
  }
  const layer = s.layer, key = layer + plasterHex;
  if (key !== lastXS) { lastXS = key; drawXS(layer, plasterHex); }
}

/* ================= LOOP & UI ================= */
let playing = true, speed = 1, TT = 0, scrubbing = false;
const scrub = document.getElementById('scrub'), playBtn = document.getElementById('play');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; playBtn.classList.toggle('on', playing); };
scrub.addEventListener('input', () => { TT = scrub.value / 1000 * L; scrubbing = true; });
scrub.addEventListener('change', () => { scrubbing = false; });
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b)); });
const qp = new URLSearchParams(location.search); if (qp.has('t')) { TT = +qp.get('t'); playing = false; }
resize();
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  userZoom += (zoomTarget - userZoom) * (1 - Math.exp(-dt * 7));
  if (playing && !scrubbing) TT = (TT + dt * speed) % L;
  if (!scrubbing) scrub.value = Math.round(TT / L * 1000);
  controls.update(); apply(TT);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.__ready = true;
</script>
</body>
