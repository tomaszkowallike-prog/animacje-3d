<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drabina na dach – animacja 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1726;--panel:rgba(13,23,38,.86);--ink:#f3efe6;--muted:#9fb0c4;--accent:#ff7a1a;--accent2:#ffb36b;--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #view{position:fixed;inset:0}
  #view canvas{display:block;width:100%;height:100%;touch-action:none}
  .cond{font-family:"Barlow Condensed",Inter,sans-serif}

  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;pointer-events:none;background:linear-gradient(rgba(10,19,34,.75),transparent)}
  .brand{font:700 24px "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.02em}
  .brand span{color:var(--accent)}
  .top .tel{font-size:14px;color:var(--muted)} .top .tel b{color:var(--ink)}

  #labels{position:fixed;inset:0;pointer-events:none}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;font:600 15px "Barlow Condensed",Inter,sans-serif;letter-spacing:.04em;color:var(--accent2);background:rgba(10,19,34,.88);border:1.5px solid var(--accent);border-radius:99px;padding:3px 11px;opacity:0;transition:opacity .35s;will-change:transform}
  .lbl.on{opacity:1}
  .lbl.big{font-size:19px;padding:4px 14px;color:#fff;background:var(--accent);border-color:var(--accent)}

  .cap{position:fixed;left:24px;bottom:96px;width:min(430px,calc(100vw - 48px));background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:18px 20px 16px;transition:opacity .35s,transform .35s}
  .cap.swap{opacity:0;transform:translateY(8px)}
  .eyebrow{display:flex;align-items:center;gap:10px;font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--accent)}
  .cap h2{font:700 38px/1 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;margin:8px 0 8px}
  .cap p{margin:0 0 10px;color:#cfd8e3;font-size:14.5px;line-height:1.5}
  .specs{display:grid;gap:6px;margin:0;padding:0;list-style:none}
  .specs li{display:flex;justify-content:space-between;gap:14px;padding:7px 11px;border-radius:9px;background:rgba(255,255,255,.05);font-size:13.5px;color:var(--muted)}
  .specs li b{font:600 18px "Barlow Condensed",Inter,sans-serif;color:var(--ink);white-space:nowrap}
  .live{margin-top:10px;font:600 22px "Barlow Condensed",Inter,sans-serif;color:var(--accent2);min-height:0}

  .bar{position:fixed;left:24px;right:24px;bottom:24px;display:flex;gap:14px;align-items:center}
  .play{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#1a0d02;cursor:pointer;display:grid;place-items:center}
  .play svg{width:20px;height:20px}
  .trackwrap{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px 8px;backdrop-filter:blur(10px)}
  .track{position:relative;display:flex;gap:3px;height:10px;cursor:pointer;touch-action:none}
  .seg{position:relative;height:100%;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
  .seg i{position:absolute;inset:0;width:0;background:var(--accent)}
  .seg.cur{background:rgba(255,122,26,.25)}
  .meta{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:600}
  .hint{position:fixed;right:24px;bottom:104px;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;transition:opacity .3s}
  .loading{position:fixed;inset:0;display:grid;place-items:center;font:600 20px "Barlow Condensed",Inter,sans-serif;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;transition:opacity .5s}

  @media (max-width:760px){
    .top{padding:12px 14px}.brand{font-size:20px}.top .tel{font-size:12px}
    .cap{left:10px;right:10px;width:auto;bottom:76px;padding:12px 14px 12px;border-radius:14px}
    .cap h2{font-size:26px;margin:5px 0}
    .cap p{font-size:13px;margin-bottom:6px}
    .specs li{padding:5px 9px;font-size:12px}.specs li b{font-size:15px}
    .bar{left:10px;right:10px;bottom:12px;gap:10px}
    .play{width:46px;height:46px}
    .hint{display:none}
    .lbl{font-size:12.5px;padding:2px 8px}
    .lbl.big{font-size:15px}
  }
</style>

<body>
<div id="view"></div>
<div id="labels"></div>
<div class="loading" id="loading">Ładowanie modelu 3D…</div>

<div class="top">
  <div class="brand">Drabina<span>na</span>dach</div>
  <div class="tel">tel. <b>666 699 927</b></div>
</div>

<div class="cap" id="cap">
  <div class="eyebrow" id="capE"></div>
  <h2 id="capT"></h2>
  <p id="capP"></p>
  <ul class="specs" id="capS"></ul>

</div>

    <div class="track" id="track"></div>
    <div class="meta"><span id="metaL"></span><span id="metaR"></span></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
const bg=document.createElement('canvas');bg.width=4;bg.height=512;
{const c=bg.getContext('2d'),g=c.createLinearGradient(0,0,0,512);g.addColorStop(0,'#0a1424');g.addColorStop(.5,'#1f3a5a');g.addColorStop(.85,'#55718f');g.addColorStop(1,'#6f88a2');c.fillStyle=g;c.fillRect(0,0,4,512);}

/* ---------- materials ---------- */
const M={
  steel:new THREE.MeshStandardMaterial({color:0xc4cdd5,metalness:.9,roughness:.3,envMapIntensity:1.2}),
  steelDark:new THREE.MeshStandardMaterial({color:0x8d98a3,metalness:.85,roughness:.4}),

  glass:new THREE.MeshStandardMaterial({color:0x1d2c42,metalness:.4,roughness:.12}),

  pv:new THREE.MeshStandardMaterial({color:0x1b3466,metalness:.6,roughness:.25}),
  grey:new THREE.MeshStandardMaterial({color:0xc6cbd1,roughness:.6,metalness:.2}),

M.epsFront=M.plaster.clone();M.epsFront.transparent=true;
// lock mesh texture
const lt=document.createElement('canvas');lt.width=lt.height=128;
{const c=lt.getContext('2d');c.fillStyle='#2c3b52';c.fillRect(0,0,128,128);c.strokeStyle='#4d6585';c.lineWidth=7;
 for(let i=-128;i<256;i+=22){c.beginPath();c.moveTo(i,0);c.lineTo(i+128,128);c.stroke();c.beginPath();c.moveTo(i,128);c.lineTo(i+128,0);c.stroke();}}
const lockTex=new THREE.CanvasTexture(lt);lockTex.wrapS=lockTex.wrapT=THREE.RepeatWrapping;lockTex.repeat.set(2,6);lockTex.colorSpace=THREE.SRGBColorSpace;

function box(w,h,d,mat,parent,x=0,y=0,z=0,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;parent&&parent.add(m);return m;}

const WALL_H=4.0, TOP=5.1;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),M.ground);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
box(14,0.02,3.2,M.pave,scene,0,0.01,1.8,false);
box(8,WALL_H,6,M.plaster,scene,0,WALL_H/2,-3);
box(8.02,0.06,6.02,M.roof,scene,0,WALL_H+0.03,-3);
const ins=new THREE.Mesh(new THREE.BoxGeometry(8,WALL_H,1),[M.eps,M.eps,M.epsFront,M.epsFront,M.epsFront,M.epsFront]);
ins.position.y=WALL_H/2;ins.castShadow=true;ins.receiveShadow=true;scene.add(ins);
const flash=box(8.1,0.08,1,M.flash,scene,0,WALL_H+0.04,0);

  box(w+0.12,h+0.12,0.04,M.frame,g,0,0,0.02,false);box(w,h,0.05,M.glass,g,0,0,0.035,false);
  box(0.05,h,0.06,M.frame,g,0,0,0.04,false);parent.add(g);return g;}
const V={dom:new THREE.Group(),blok:new THREE.Group(),hala:new THREE.Group()};
Object.values(V).forEach(g=>facade.add(g));
const R={dom:new THREE.Group(),blok:new THREE.Group(),hala:new THREE.Group()};
Object.values(R).forEach(g=>scene.add(g));
// dom
windowAt(-2.5,1.3,1.1,1.2,V.dom);windowAt(-2.5,3.0,1.1,1.0,V.dom);windowAt(2.5,3.0,1.1,1.0,V.dom);
box(1.0,2.1,0.08,M.door,V.dom,2.5,1.05,0.04);box(1.4,0.08,0.5,M.frame,V.dom,2.5,2.3,0.25);
box(0.55,1.1,0.55,M.brick,R.dom,-2.6,WALL_H+0.55,-2.6);box(0.7,0.12,0.7,M.brick,R.dom,-2.6,WALL_H+1.12,-2.6);
for(const x of [1.4,3.0]){const p=box(1.5,0.04,1.0,M.pv,R.dom,x,WALL_H+0.45,-2.6);p.rotation.x=-0.45;box(0.05,0.4,0.05,M.steelDark,R.dom,x,WALL_H+0.2,-2.25);}
// blok
for(const x of [-3.1,-1.9,1.9,3.1]) for(const y of [0.9,2.15,3.35]) windowAt(x,y,0.75,0.85,V.blok);
box(1.0,0.6,0.7,M.grey,R.blok,2.6,WALL_H+0.3,-1.6);
{const f=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.02,24),M.steelDark);f.rotation.x=Math.PI/2;f.position.set(2.6,WALL_H+0.3,-1.24);R.blok.add(f);}
box(1.4,0.9,1.2,M.grey,R.blok,-2.4,WALL_H+0.45,-3.5);
// hala
for(let x=-3.85;x<=3.9;x+=0.32) box(0.05,WALL_H-0.05,0.035,M.flash,V.hala,x,WALL_H/2,0.02,false);
{const d=box(2.2,2.7,0.08,M.grey,V.hala,2.6,1.35,0.06);for(let y=0.3;y<2.7;y+=0.34)box(2.2,0.03,0.1,M.steelDark,V.hala,2.6,y,0.07,false);}
box(2.4,0.35,0.06,new THREE.MeshStandardMaterial({color:0x9fc8e2,metalness:.3,roughness:.1}),V.hala,-2.4,3.3,0.03,false);
{const s=box(1.8,0.35,1.3,new THREE.MeshStandardMaterial({color:0xa9d4ee,transparent:true,opacity:.75,metalness:.2,roughness:.1}),R.hala,2.0,WALL_H+0.18,-2.6);}
const VARC={dom:new THREE.Color(0xdccfba),blok:new THREE.Color(0xc4bcae),hala:new THREE.Color(0x97a2ad)};

/* ---------- ladder ---------- */
const lad=new THREE.Group();scene.add(lad);
const RX=0.265;
function railGeo(){const g=new THREE.BoxGeometry(0.03,1,0.05);g.translate(0,0.5,0);return g;}
const rails=[-RX,RX].map(x=>{const m=new THREE.Mesh(railGeo(),M.steel);m.position.x=x;m.castShadow=true;m.receiveShadow=true;lad.add(m);return m;});
// top bend
const bendH=[-RX,RX].map(x=>{const g=new THREE.BoxGeometry(0.03,0.05,1);g.translate(0,0,-0.5);const m=new THREE.Mesh(g,M.steel);m.position.set(x,TOP-0.025,0);m.castShadow=true;lad.add(m);m.visible=false;return m;});
const bendV=[-RX,RX].map(x=>{const g=new THREE.BoxGeometry(0.03,1,0.05);g.translate(0,-0.5,0);const m=new THREE.Mesh(g,M.steel);m.position.set(x,TOP,0);m.castShadow=true;lad.add(m);m.visible=false;return m;});
// rungs with anti-slip teeth
const rungParts=[new THREE.BoxGeometry(0.5,0.03,0.03)];
for(let x=-0.235;x<=0.236;x+=0.0235){const t=new THREE.BoxGeometry(0.008,0.007,0.03);t.translate(x,0.018,0);rungParts.push(t);}
const rungGeo=mergeGeometries(rungParts);
const RUNG_Y=[];for(let k=1;k*0.27<=WALL_H-0.05;k++)RUNG_Y.push(k*0.27);
const rungs=RUNG_Y.map(y=>{const m=new THREE.Mesh(rungGeo,M.steel);m.position.y=y;m.castShadow=true;m.visible=false;lad.add(m);return m;});
// brackets
const BR_Y=[0.75,2.05,3.35];
const brackets=[];
BR_Y.forEach(y=>[-RX,RX].forEach(x=>{
  const g=new THREE.Group();g.position.set(x,y,0);lad.add(g);
  const plate=box(0.11,0.18,0.012,M.steelDark,g);
  const sleeve=box(0.05,0.05,0.14,M.steelDark,g);
  const armG=new THREE.BoxGeometry(0.036,0.036,1);armG.translate(0,0,0.5);
  const arm=new THREE.Mesh(armG,M.steel);arm.castShadow=true;g.add(arm);
  const clamp_=box(0.06,0.07,0.03,M.steelDark,g,0,0,-0.035);
  const bolts=[];for(const by of [-0.06,0.06]){const b=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.02,10),M.steel);b.rotation.x=Math.PI/2;b.position.y=by;g.add(b);bolts.push(b);}
  brackets.push({g,plate,sleeve,arm,bolts});
}));
// cage
const CAGE_C=0.265, CAGE_R=0.375, HOOP_Y=[2.5,3.14,3.78,4.42,5.06];
const hoopGeo=new THREE.TorusGeometry(CAGE_R,0.012,8,64,Math.PI*1.5);hoopGeo.rotateZ(-Math.PI/4);hoopGeo.rotateX(Math.PI/2);hoopGeo.scale(1,3.2,0.55);
const hoops=HOOP_Y.map(y=>{const g=new THREE.Group();g.position.set(0,y,CAGE_C);const m=new THREE.Mesh(hoopGeo,M.steel);m.castShadow=true;g.add(m);g.visible=false;lad.add(g);return g;});
const BAR_L=HOOP_Y[4]-HOOP_Y[0];
const bars=[0,45,90,135,180].map(a=>{const r=a*Math.PI/180;const geo=new THREE.BoxGeometry(0.035,1,0.006);geo.translate(0,0.5,0);
  const m=new THREE.Mesh(geo,M.steel);m.rotation.y=Math.PI/2-r;m.position.set(CAGE_R*Math.cos(r),HOOP_Y[0],CAGE_C+CAGE_R*Math.sin(r));m.castShadow=true;m.visible=false;lad.add(m);return m;});
// lock: hinged cover plate under the first cage hoop (closes the cage from below)
const LOCK_Y=HOOP_Y[0]-0.035, HINGE_Z=CAGE_C+CAGE_R+0.01;
const lockPivot=new THREE.Group();lockPivot.position.set(0,LOCK_Y,HINGE_Z);lad.add(lockPivot);
const lockShape=new THREE.Shape();
{const r=CAGE_R+0.01,c=CAGE_C,s0=0.035,th0=Math.asin((s0-c)/r),n=48;
 const pts=[];for(let i=0;i<=n;i++){const th=th0+(Math.PI-2*th0)*i/n;pts.push([r*Math.cos(th),c+r*Math.sin(th)]);}

 lockShape.moveTo(pts[0][0],pts[0][1]);pts.forEach(p=>lockShape.lineTo(p[0],p[1]));lockShape.lineTo(pts[0][0],pts[0][1]);

const lockMat=new THREE.MeshStandardMaterial({color:0xb7c0c8,metalness:.6,roughness:.45,side:THREE.DoubleSide,emissive:0x5b636b,envMapIntensity:1.4});
const lockPlate=new THREE.Mesh(lockGeo,lockMat);lockPlate.castShadow=true;lockPlate.receiveShadow=false;lockPivot.add(lockPlate);
{const h=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,0.16,12),M.steelDark);h.rotation.z=Math.PI/2;lockPivot.add(h);
 const lug=box(0.16,0.05,0.01,M.steelDark,lad,0,LOCK_Y+0.02,HINGE_Z+0.004);}
const padlock=new THREE.Group();padlock.position.set(0,-0.05,0.035-HINGE_Z+0.02);lockPivot.add(padlock);
box(0.05,0.03,0.006,M.steelDark,padlock,0,0.035,0);
box(0.07,0.06,0.03,M.orange,padlock,0,-0.02,0);
{const sh=new THREE.Mesh(new THREE.TorusGeometry(0.022,0.006,8,20,Math.PI),M.steel);sh.position.y=0.01;padlock.add(sh);}
lockPivot.visible=false;

/* ---------- dimension helpers ---------- */
const dimGroups=[];
function dim(parent){const g=new THREE.Group();parent.add(g);g.renderOrder=999;
  const mat=M.dim.clone();
  const line=new THREE.Mesh(new THREE.CylinderGeometry(0.007,0.007,1,8),mat);line.renderOrder=999;

  g.add(line,e1,e2);const o={g,mat,anchor:new THREE.Object3D(),target:0};g.add(o.anchor);
  o.set=(a,b)=>{const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);const mid=A.clone().add(B).multiplyScalar(.5);

const VNAMES={dom:'Dom jednorodzinny',blok:'Budynek wielorodzinny',hala:'Hala / obiekt przemysłowy'};
let curVar='dom';
function apply(t,dt){
  const k=sceneAt(t);
  // distance from wall
  let d=0.20;
  if(t>=T[5]){const v=(t-T[5])/S[5].d;d=0.20+(0.41-0.20)*ease(clamp((v-.22)/.3))+(0.31-0.41)*ease(clamp((v-.66)/.22));}
  const insT=d-0.08;
  lad.position.z=d;ins.scale.z=insT;ins.position.z=insT/2;facade.position.z=insT;
  flash.scale.z=insT+0.12;flash.position.z=(insT+0.12)/2-0.1;
  const xr=k===5?win((t-T[5])/S[5].d,.05,.97,.08):0;
  const op=1-0.72*xr;M.eps.opacity=op;M.epsFront.opacity=op;M.eps.depthWrite=M.epsFront.depthWrite=op>0.99;

  // rails
  const g1=ease(clamp((t-T[1]-0.3)/2.6));
  rails.forEach(r=>{r.visible=g1>0;r.scale.y=Math.max(1e-4,TOP*g1);});
  // brackets
  brackets.forEach((b,i)=>{const s=back(clamp((t-T[1]-2.9-(i>>1)*0.25)/0.6));b.g.visible=s>0;b.g.scale.setScalar(Math.max(1e-4,s));
    b.plate.position.z=-d+0.006;b.sleeve.position.z=-d+0.08;b.arm.position.z=-d+0.012;b.arm.scale.z=Math.max(0.01,d-0.05);
    b.bolts.forEach(bb=>bb.position.z=-d+0.016);});
  // rungs
  rungs.forEach((r,i)=>{const s=clamp((t-T[2]-0.3-i*0.3)/0.45),e=ease(s);r.visible=s>0;r.position.y=RUNG_Y[i]+(1-e)*0.35;r.position.z=(1-e)*0.5;r.rotation.y=(1-e)*0.9;});
  // cage
  hoops.forEach((h,i)=>{const s=back(clamp((t-T[6]-0.5-i*0.45)/0.6));h.visible=s>0;h.scale.setScalar(Math.max(1e-4,s));});
  const bs=ease(clamp((t-T[6]-2.9)/1.4));bars.forEach(b=>{b.visible=bs>0;b.scale.y=Math.max(1e-4,BAR_L*bs);});
  // top bend
  const b1=ease(clamp((t-T[7]-0.6)/1.3)),b2=ease(clamp((t-T[7]-1.8)/0.9));
  bendH.forEach(m=>{m.visible=b1>0;m.scale.z=Math.max(1e-4,(d+0.7)*b1);});
  bendV.forEach(m=>{m.visible=b2>0;m.scale.y=Math.max(1e-4,(TOP-WALL_H-0.06)*b2);m.position.z=-(d+0.7)+0.015;});
  // lock
  const la=clamp((t-T[8]-0.2)/0.5);lockPivot.visible=la>0;lockPivot.scale.setScalar(Math.max(1e-4,back(la)));
  lockPivot.rotation.x=lerp(-Math.PI/2+0.06,0,ease(clamp((t-T[8]-1.3)/1.6)));

    rainPos[o]=x;rainPos[o+1]=y;rainPos[o+2]=z;rainPos[o+3]=x-0.02;rainPos[o+4]=y+0.28;rainPos[o+5]=z;}rainGeo.attributes.position.needsUpdate=true;}
  if(snowA>0){for(let i=0;i<SNOW_N;i++){const [x,z,s]=snowSeed[i];const o=i*3;
    snowPos[o]=x+Math.sin(t*1.2+s*20)*0.15;snowPos[o+1]=7.5-((s*7.5+t*0.7)%7.5);snowPos[o+2]=z;}snowGeo.attributes.position.needsUpdate=true;}

  dimShow.forEach(([o,f])=>{o.target=f(t)?1:0;o.mat.opacity=lerp(o.mat.opacity,o.target,dt>0?clamp(dt*7):1);o.g.visible=o.mat.opacity>0.01;});

  // caption live

  else if(k===9)live.textContent='▸ '+VNAMES[v];
  else live.textContent='';
}

/* ---------- camera from time ---------- */
const P0=new THREE.Vector3(),P1=new THREE.Vector3(),T0=new THREE.Vector3(),T1=new THREE.Vector3();
function camPose(i,u,outP,outT){const [a,b]=S[i].cam;const e=ease(clamp(u));
  outP.set(lerp(a[0],b[0],e),lerp(a[1],b[1],e),lerp(a[2],b[2],e));outT.set(lerp(a[3],b[3],e),lerp(a[4],b[4],e),lerp(a[5],b[5],e));}
function cameraAt(t){const i=sceneAt(t),u=(t-T[i])/S[i].d;camPose(i,u,P0,T0);
  const bl=1.6;if(t-T[i]<bl){const prev=i>0?i-1:S.length-1;camPose(prev,1,P1,T1);const k=ease((t-T[i])/bl);if(i>0||t>0.01){P0.lerpVectors(P1,P0,k);T0.lerpVectors(T1,T0,k);}}
  camera.position.copy(P0);camera.lookAt(T0);return T0;}

const ICON_PLAY='<svg viewBox="0 0 20 20"><path d="M5 3 L17 10 L5 17 Z" fill="currentColor"/></svg>';
function setPlaying(p){playing=p;playBtn.innerHTML=p?ICON_PAUSE:ICON_PLAY;playBtn.setAttribute('aria-label',p?'Pauza':'Odtwórz');
  controls.enabled=!p;$('#hint').style.opacity=p?0:1;
  if(!p){controls.target.copy(cameraAt(t));controls.update();}}

renderer.domElement.addEventListener('pointerdown',()=>{if(playing)setPlaying(false);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}});
let dragging=false;
function seek(e){const r=track.getBoundingClientRect();t=clamp((e.clientX-r.left)/r.width)*TEND*0.9999;if(!playing){cameraAt(t);controls.target.copy(T0);}}

track.addEventListener('pointermove',e=>{if(dragging)seek(e);});
track.addEventListener('pointerup',()=>{dragging=false;});

function updateCaption(i){const c=$('#cap');c.classList.add('swap');
  setTimeout(()=>{const s=S[lastScene];$('#capE').textContent=s.e;$('#capT').textContent=s.t;$('#capP').textContent=s.p;
    $('#capS').innerHTML=s.s.map(([a,b])=>`<li><span>${a}</span><b>${b}</b></li>`).join('');c.classList.remove('swap');},200);}
const mm=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* ---------- resize / loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;
  camera.fov=w/h<1?Math.min(68,40/(w/h)*0.72):40;
  if(w>900){const off=Math.min(240,w*0.15);camera.setViewOffset(w,h,-off,0,w,h);}else if(w/h<1){camera.setViewOffset(w,h,0,h*0.17,w,h);}else camera.clearViewOffset();
  camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const v3=new THREE.Vector3();
function placeLabels(){const w=innerWidth,h=innerHeight;
  labels.forEach(L=>{const on=L.show(t);L.el.classList.toggle('on',on);if(!on&&L.el.style.opacity==='0')return;
    L.obj.getWorldPosition(v3);v3.project(camera);
    if(v3.z>1){L.el.classList.remove('on');return;}
    const x=(v3.x+1)/2*w+L.dx,y=(1-v3.y)/2*h+L.dy;
    L.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;});}

const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.1);
  if(playing&&!dragging){t+=dt;if(t>=TEND)t=0;}
  apply(t,dt);
  if(playing||dragging){if(!playing&&dragging){/* keep orbit target synced while scrubbing */}
    if(playing)cameraAt(t);else{cameraAt(t);controls.target.copy(T0);}}
  else controls.update();
  const i=sceneAt(t);if(i!==lastScene){updateCaption(i);lastScene=i;}
  segs.forEach((s,j)=>{const f=clamp((t-T[j])/S[j].d);s.firstChild.style.width=(f*100)+'%';s.classList.toggle('cur',j===i);});
  $('#metaL').innerHTML=`<b>${S[i].e}</b>`;$('#metaR').textContent=`${mm(t)} / ${mm(TEND)}`;
  renderer.render(scene,camera);placeLabels();}
setPlaying(true);apply(0,0);cameraAt(0);
$('#loading').style.opacity=0;setTimeout(()=>$('#loading').remove(),600);
window.__seek=(s)=>{t=s;};window.__pause=()=>setPlaying(false);
frame();
