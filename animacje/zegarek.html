<style>

<body>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, b) => ease((t - a) / (b - a));

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 1, 2000);
camera.position.set(0, 18, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enableZoom = false; controls.enablePan = false;
let userZoom = 1;
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); userZoom = clamp(userZoom * (1 + e.deltaY * 0.001), 0.45, 2.2); }, { passive: false });

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(40, 60, 80); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 1.0); rim.position.set(-70, 20, -60); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

const pivot = new THREE.Group(); scene.add(pivot);       // tilt (x)
const spin = new THREE.Group(); pivot.add(spin);         // turn (y)
const watch = new THREE.Group(); spin.add(watch);        // re-centres when exploded

/* ---------------- materials ---------------- */
const M = {
  resin: new THREE.MeshStandardMaterial({ color: 0x17181a, roughness: 0.62, metalness: 0 }),
  resinGloss: new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.35 }),
  strap: new THREE.MeshStandardMaterial({ color: 0x151618, roughness: 0.7, side: THREE.DoubleSide }),
  steel: new THREE.MeshStandardMaterial({ color: 0xd9dcdf, roughness: 0.26, metalness: 1 }),
  darkSteel: new THREE.MeshStandardMaterial({ color: 0x6d7177, roughness: 0.35, metalness: 1 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xd0a457, roughness: 0.32, metalness: 1 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xc7713c, roughness: 0.35, metalness: 1 }),
  ceramic: new THREE.MeshStandardMaterial({ color: 0xece8dc, roughness: 0.55 }),
  blob: new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.18 }),
  tan: new THREE.MeshStandardMaterial({ color: 0xb48a5a, roughness: 0.5 }),
  smdBlack: new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.4 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x0d0d0e, roughness: 0.85 }),
  zebra: new THREE.MeshStandardMaterial({ color: 0xc9a9ad, roughness: 0.8 }),
  plastic: new THREE.MeshStandardMaterial({ color: 0x26282c, roughness: 0.5 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.4 }),
  led: new THREE.MeshStandardMaterial({ color: 0xffe9a8, roughness: 0.1, emissive: 0x000000 }),
  hole: new THREE.MeshBasicMaterial({ color: 0x050505 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, metalness: 0, transparent: true, opacity: 0.16, clearcoat: 1, depthWrite: false }),
  red: new THREE.MeshStandardMaterial({ color: 0xd8261c, roughness: 0.45 }),
};

/* ---------------- helpers ---------------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.userData.ctx = g; t.userData.canvas = c; return t;
}
function rrPath(P, w, h, r, cx = 0, cy = 0) {
  const x = cx - w / 2, y = cy - h / 2;
  P.moveTo(x + r, y); P.lineTo(x + w - r, y); P.absarc(x + w - r, y + r, r, -PI / 2, 0, false);
  P.lineTo(x + w, y + h - r); P.absarc(x + w - r, y + h - r, r, 0, PI / 2, false);
  P.lineTo(x + r, y + h); P.absarc(x + r, y + h - r, r, PI / 2, PI, false);
  P.lineTo(x, y + r); P.absarc(x + r, y + r, r, PI, 1.5 * PI, false);
  return P;
}
const rrShape = (w, h, r, cx, cy) => rrPath(new THREE.Shape(), w, h, r, cx, cy);
const rrHole = (w, h, r, cx, cy) => rrPath(new THREE.Path(), w, h, r, cx, cy);
function extrude(shape, depth, z0, bevel = 0, curve = 24) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: curve });
  g.translate(0, 0, z0); return g;
}
// planar UV mapping for extrude caps: shape coords -> [0,1]
function capTex(tex, W, H) { tex.repeat.set(1 / W, 1 / H); tex.offset.set(0.5, 0.5); tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping; return tex; }
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (parent) parent.add(m); return m; }

/* helical screw thread — real helix, profile r(z - p·θ/2π) */
function threadGeo(rMin, rMaj, pitch, len, nA = 44, perPitch = 16) {
  const nZ = Math.ceil(len / pitch * perPitch), pos = [], idx = [];
  for (let i = 0; i <= nZ; i++) {
    const z = len * i / nZ;
    for (let j = 0; j <= nA; j++) {
      const a = TAU * j / nA;
      let ph = ((z / pitch - j / nA) % 1 + 1) % 1;
      let f = ph < .5 ? ph * 2 : 2 - ph * 2;           // triangular tooth
      f = clamp((f - 0.12) / 0.76);                     // flat crest + root
      let r = rMin + (rMaj - rMin) * f;
      const tip = len - z; if (tip < pitch) r = Math.min(r, rMin * 0.8 + (rMaj - rMin * 0.8) * tip / pitch);
      pos.push(r * Math.cos(a), r * Math.sin(a), -z);
    }
  }
  for (let i = 0; i < nZ; i++) for (let j = 0; j < nA; j++) {
    const a = i * (nA + 1) + j, b = a + nA + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
class Helix extends THREE.Curve {
  constructor(r, len, turns) { super(); this.r = r; this.len = len; this.turns = turns; }
  getPoint(t, o = new THREE.Vector3()) { const a = TAU * this.turns * t; return o.set(this.r * Math.cos(a), this.r * Math.sin(a), this.len * t); }
}
function loopTube(w, h, r, tube, segs = 160) {
  const pts = rrShape(w, h, r).getSpacedPoints(segs).map(p => new THREE.Vector3(p.x, p.y, 0));
  pts.pop();
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), segs, tube, 10, true);
}

/* ---------------- part registry ---------------- */
const parts = [];
function part(name, offset, order, opts = {}) {
  const g = new THREE.Group(); g.userData.partName = name;
  watch.add(g);
  parts.push({ g, name, off: new THREE.Vector3(offset[0], offset[1], offset[2] * 1.3), order, ...opts });
  return g;
}

/* ================= TEXTURES (all drawn in code) ================= */
// 7-segment glyph engine
const SEG = ['abcdef', 'bc', 'abged', 'abgcd', 'fgbc', 'afgcd', 'afgedc', 'abc', 'abcdefg', 'abcdfg'];
function seg7(g, d, x, y, w, h, t, on, ghost) {
  const sk = 0.12 * h, gap = t * 0.18;
  const P = (px, py) => [x + px + sk * (1 - py / h), y + py];
  const hs = (x0, x1, yy) => [P(x0 + gap, yy), P(x0 + gap + t / 2, yy - t / 2), P(x1 - gap - t / 2, yy - t / 2), P(x1 - gap, yy), P(x1 - gap - t / 2, yy + t / 2), P(x0 + gap + t / 2, yy + t / 2)];
  const vs = (xx, y0, y1) => [P(xx, y0 + gap), P(xx + t / 2, y0 + gap + t / 2), P(xx + t / 2, y1 - gap - t / 2), P(xx, y1 - gap), P(xx - t / 2, y1 - gap - t / 2), P(xx - t / 2, y0 + gap + t / 2)];
  const S = { a: hs(0, w, 0), g: hs(0, w, h / 2), d: hs(0, w, h), f: vs(0, 0, h / 2), b: vs(w, 0, h / 2), e: vs(0, h / 2, h), c: vs(w, h / 2, h) };
  const lit = d == null ? '' : SEG[d];
  for (const k in S) {
    const isOn = lit.includes(k);
    g.fillStyle = isOn ? on : ghost; g.beginPath();
    S[k].forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath(); g.fill();
  }
}
const lcdTex = canvasTex(960, 680, () => {});
const DAYS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
let lcdKey = '';
function drawLCD(glow) {
  const now = new Date();
  const k = now.getSeconds() + '|' + glow.toFixed(2);
  if (k === lcdKey) return; lcdKey = k;
  const g = lcdTex.userData.ctx, W = 960, H = 680;
  const bg = g.createLinearGradient(0, 0, 0, H);
  const mix = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * glow));
  const c1 = mix([186, 194, 168], [118, 222, 205]), c2 = mix([160, 170, 145], [70, 190, 178]);
  bg.addColorStop(0, `rgb(${c1})`); bg.addColorStop(1, `rgb(${c2})`);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const ON = '#1b1f17', GH = 'rgba(30,40,20,0.07)';
  // frame lines
  g.strokeStyle = 'rgba(20,25,15,.55)'; g.lineWidth = 5; g.strokeRect(22, 22, W - 44, H - 44);
  g.beginPath(); g.moveTo(22, 220); g.lineTo(W - 22, 220); g.stroke();
  // top row: day + date
  g.fillStyle = ON; g.font = 'bold 118px Arial, Helvetica, sans-serif'; g.textBaseline = 'alphabetic';
  g.save(); g.translate(70, 180); g.transform(1, 0, -0.12, 1, 0, 0); g.fillText(DAYS[now.getDay()], 0, 0); g.restore();
  const mo = now.getMonth() + 1, da = now.getDate();
  const sx = 470, sw = 70, sh = 120, st = 17;
  seg7(g, mo >= 10 ? 1 : null, sx, 52, sw, sh, st, ON, GH);
  seg7(g, mo % 10, sx + 100, 52, sw, sh, st, ON, GH);
  g.fillStyle = ON; g.fillRect(sx + 205, 108, 34, 14);
  seg7(g, da >= 10 ? Math.floor(da / 10) : null, sx + 260, 52, sw, sh, st, ON, GH);
  seg7(g, da % 10, sx + 360, 52, sw, sh, st, ON, GH);
  // main time
  const hh = now.getHours(), mm = now.getMinutes(), ss = now.getSeconds();
  const y = 270, dw = 128, dh = 300, dt = 34;
  seg7(g, hh >= 10 ? Math.floor(hh / 10) : null, 60, y, dw, dh, dt, ON, GH);
  seg7(g, hh % 10, 240, y, dw, dh, dt, ON, GH);
  g.fillStyle = (ss % 2 === 0) ? ON : GH;
  g.fillRect(418, y + 80, 30, 30); g.fillRect(404, y + 200, 30, 30);
  seg7(g, Math.floor(mm / 10), 480, y, dw, dh, dt, ON, GH);
  seg7(g, mm % 10, 660, y, dw, dh, dt, ON, GH);
  // seconds (small)
  seg7(g, Math.floor(ss / 10), 808, y + 150, 40, 140, 14, ON, GH);
  seg7(g, ss % 10, 866, y + 150, 40, 140, 14, ON, GH);
  g.fillStyle = ON; g.font = 'bold 34px Arial, sans-serif'; g.fillText('24H', 818, y + 110);
  // tiny indicator icons
  g.fillText('♪', 840, 128); g.fillText('ALM', 36, 640);
  lcdTex.needsUpdate = true;
  document.getElementById('lt').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
}

// bezel face — 44 x 50 units
const BZ = { W: 44, H: 50 };
const bezelTex = capTex(canvasTex(880, 1000, (g, W, H) => {
  g.fillStyle = '#18191b'; g.fillRect(0, 0, W, H);
  // moulded micro-texture
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.025})`; g.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
  const u = W / BZ.W; // px per unit
  const X = x => (x + BZ.W / 2) * u, Y = y => (BZ.H / 2 - y) * u;
  // ridges top/bottom
  g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 3;
  for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(X(-12), Y(17 + i * 1.6)); g.lineTo(X(12), Y(17 + i * 1.6)); g.stroke(); g.beginPath(); g.moveTo(X(-12), Y(-17 - i * 1.6)); g.lineTo(X(12), Y(-17 - i * 1.6)); g.stroke(); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#f4f4f4'; g.font = 'italic 900 64px "Arial Black", Arial, sans-serif';
  g.fillText('KRONA', X(0), Y(20.6));
  g.fillStyle = '#d8261c'; g.font = 'bold 30px Arial, sans-serif'; g.fillText('SHOCK  RESIST', X(0), Y(-20.4));
  g.fillStyle = '#9aa0a6'; g.font = 'bold 22px Arial, sans-serif'; g.fillText('20 BAR', X(0), Y(-22.9));
  const side = (txt, x, y, rot, col = '#cfd3d6') => { g.save(); g.translate(X(x), Y(y)); g.rotate(rot); g.fillStyle = col; g.font = 'bold 24px Arial, sans-serif'; g.fillText(txt, 0, 0); g.restore(); };
  side('ADJUST', -19, 9, -PI / 2); side('MODE', -19, -9, -PI / 2);
  side('LIGHT', 19, 9, PI / 2, '#f0c640'); side('START·STOP', 19, -9, PI / 2);
}), BZ.W, BZ.H);

// face plate — 34 x 30
const FP = { W: 34, H: 30 };
const faceTex = capTex(canvasTex(1020, 900, (g, W, H) => {
  const u = W / FP.W, X = x => (x + FP.W / 2) * u, Y = y => (FP.H / 2 - y) * u;
  g.fillStyle = '#0f1012'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#2f6fd6'; g.lineWidth = 6; g.strokeRect(X(-13.1), Y(9.4), 26.2 * u, 18.8 * u);
  g.strokeStyle = '#d8261c'; g.lineWidth = 3; g.strokeRect(X(-13.8), Y(10.1), 27.6 * u, 20.2 * u);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#c9ced3'; g.font = 'bold 30px Arial, sans-serif'; g.fillText('MULTI ALARM  ·  CHRONOGRAPH', X(0), Y(11.9));
  g.fillStyle = '#7d848b'; g.font = 'bold 24px Arial, sans-serif'; g.fillText('ILLUMINATOR', X(-7), Y(-11.8)); g.fillText('WR 200M', X(8), Y(-11.8));
}), FP.W, FP.H);

// case back — 38 x 38 (mirrored: viewed from behind)
const CB = 38;
const backTex = capTex(canvasTex(1024, 1024, (g, W, H) => {
  g.translate(W, 0); g.scale(-1, 1);
  g.fillStyle = '#b9bdc1'; g.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  for (let r = 4; r < W * 0.75; r += 1.5) { g.strokeStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '40,45,50'},${Math.random() * 0.12})`; g.lineWidth = 1.2; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke(); }
  g.strokeStyle = 'rgba(40,44,50,.55)'; g.lineWidth = 4; g.beginPath(); g.arc(cx, cy, 300, 0, TAU); g.stroke(); g.beginPath(); g.arc(cx, cy, 380, 0, TAU); g.stroke();
  g.fillStyle = 'rgba(35,38,44,.85)'; g.font = 'bold 38px Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const ring = 'WATER RESIST 20 BAR  ·  SHOCK RESIST  ·  STAINLESS STEEL BACK  ·  ';
  const chars = ring.split(''), step = TAU / chars.length;
  chars.forEach((ch, i) => { g.save(); g.translate(cx, cy); g.rotate(i * step - PI / 2 + PI / 2); g.translate(0, -340); g.fillText(ch, 0, 0); g.restore(); });
  g.font = 'italic 900 78px "Arial Black", Arial, sans-serif'; g.fillText('KRONA', cx, cy - 70);
  g.font = 'bold 40px Arial, sans-serif'; g.fillText('MODULE K-5600', cx, cy + 20); g.fillText('BATTERY CR2016', cx, cy + 80);
  g.font = 'bold 30px Arial, sans-serif'; g.fillText('SERIAL 03 11 26', cx, cy + 150);
}), CB, CB);

// PCB — 29 x 27, front & back, every trace generated
const PCB = { W: 29, H: 27 };
function pcbTex(side) {
  return canvasTex(1160, 1080, (g, W, H) => {
    const u = W / PCB.W, X = x => (x + PCB.W / 2) * u, Y = y => (PCB.H / 2 - y) * u;
    g.fillStyle = '#0d4f2b'; g.fillRect(0, 0, W, H);
    const rnd = (() => { let s = side === 'front' ? 7 : 31; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
    const trace = (pts, w = 5) => {
      g.strokeStyle = '#2e8a52'; g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round';
      g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y))); g.stroke();
    };
    const via = (x, y) => { g.fillStyle = '#d6b25e'; g.beginPath(); g.arc(X(x), Y(y), 9, 0, TAU); g.fill(); g.fillStyle = '#1a1a1a'; g.beginPath(); g.arc(X(x), Y(y), 4, 0, TAU); g.fill(); };
    const pad = (x, y, w, h) => { g.fillStyle = '#e0bd62'; g.fillRect(X(x - w / 2), Y(y + h / 2), w * u, h * u); };
    // ground pour hatch
    g.strokeStyle = 'rgba(60,150,90,.18)'; g.lineWidth = 2;
    for (let i = -H; i < W; i += 22) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + H, H); g.stroke(); }
    // mounting holes
    [[-12.5, 11.5], [12.5, -11.5]].forEach(([x, y]) => { g.fillStyle = '#d6b25e'; g.beginPath(); g.arc(X(x), Y(y), 26, 0, TAU); g.fill(); g.fillStyle = '#050505'; g.beginPath(); g.arc(X(x), Y(y), 14, 0, TAU); g.fill(); });
    if (side === 'front') {
      // LCD zebra contact rows — 36 fingers top & bottom, each routed with a 45° jog to a via
      for (const s of [1, -1]) {
        const n = 36;
        for (let i = 0; i < n; i++) {
          const x = -10 + 20 * i / (n - 1), y0 = 7.2 * s;
          pad(x, y0, 0.32, 1.1);
          const tx = -11 + 22 * ((i * 7) % n) / n * 0.9 + 1, ty = (1.2 + (i % 6) * 0.75) * s;
          const y1 = y0 - 1.0 * s, dx = tx - x, jog = Math.min(Math.abs(dx), Math.abs(y1 - ty) - 0.4);

function sweepStrap(pts, w, thick) {
  const pos = [], idx = []; const n = pts.length;
  const frames = pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let ty = b[0] - a[0], tz = b[1] - a[1]; const l = Math.hypot(ty, tz); ty /= l; tz /= l;
    return { y: p[0], z: p[1], ny: -tz, nz: ty, th: thick(i / (n - 1)) };
  });
  const corner = (f, k) => {
    const sx = (k === 0 || k === 3) ? -w / 2 : w / 2, sn = (k < 2) ? f.th / 2 : -f.th / 2;
    return [sx, f.y + f.ny * sn, f.z + f.nz * sn];
  };
  for (let side = 0; side < 4; side++) {
    const base = pos.length / 3;
    frames.forEach(f => { pos.push(...corner(f, side), ...corner(f, (side + 1) % 4)); });
    for (let i = 0; i < n - 1; i++) { const a = base + i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  for (const end of [0, n - 1]) { const base = pos.length / 3; for (let k = 0; k < 4; k++) pos.push(...corner(frames[end], k)); idx.push(base, base + 1, base + 2, base, base + 2, base + 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return { geo: g, frames };
}
function strapPath(sign, R, A, n = 90) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = A * i / n; pts.push([sign * (25.2 + R * Math.sin(a)), -1.5 - R * (1 - Math.cos(a))]); }
  return pts;
}

  tip.style.left = (hoverEvt.clientX + 14) + 'px'; tip.style.top = (hoverEvt.clientY + 12) + 'px';

  for (let i = 0; i < KEYS.length - 1; i++) {
    const a = KEYS[i], b = KEYS[i + 1];
    if (t <= b[0]) { const k = ease((t - a[0]) / (b[0] - a[0])); return a.map((v, j) => v + (b[j] - v) * k); }
  }
  return KEYS[KEYS.length - 1];
}
const PHASES = [
  [0, '01', 'assembled — live local time on the LCD'], [0.7, '01', 'LIGHT pressed — backlight on'], [2.6, '02', 'flip to the case back'],
  [4.6, '03', `unscrewing 4 threaded screws · ${TURNS} turns each`], [8.2, '04', `exploding ${parts.length} parts`],
  [11.8, '05', 'exploded view'], [15, '06', 'reassembling'], [18.6, '07', 'driving screws home'],
  [21.8, '08', 'flip to the dial'], [24, '01', 'assembled'],
];
const phaseEl = document.getElementById('phase'); let lastPhase = '';
const maxOrder = Math.max(...parts.map(p => p.order)), SPREAD = 0.9;

function apply(t) {
  const [, ry, rx, dist] = keyAt(t);
  spin.rotation.y = ry; pivot.rotation.x = rx;
  const U = ramp(t, 4.6, 8.2) * (1 - ramp(t, 18.6, 21.8));
  const E = ramp(t, 8.2, 11.8) * (1 - ramp(t, 15, 18.6));
  watch.position.z = 17 * E;
  for (const p of parts) {
    const k = ease(clamp(E * (1 + SPREAD) - SPREAD * p.order / maxOrder));
    if (p.screw) continue;
    p.g.position.copy(p.off).multiplyScalar(k);
  }
  // screws: rotate + translate along helix, then fly with the explosion
  for (const s of screws) {
    const p = parts.find(q => q.g === s.g);
    const k = ease(clamp(E * (1 + SPREAD) - SPREAD * p.order / maxOrder));
    const ang = U * TURNS * TAU;
    s.rot.rotation.z = ang;
    s.g.position.copy(s.home).addScaledVector(p.off, k);
    s.g.position.z -= U * TRAVEL;
  }
  // LIGHT button + backlight
  const press = ramp(t, 0.7, 0.85) * (1 - ramp(t, 2.25, 2.45));
  const glow = ramp(t, 0.8, 1.0) * (1 - ramp(t, 2.3, 2.6));
  buttons.forEach(b => { b.capIn.position.x = b.nm === 'LIGHT' ? -b.sx * 0.7 * press : 0; });
  const fm = lcd.userData.front; fm.emissive.setRGB(glow * 0.55, glow * 0.75, glow * 0.7);
  M.led.emissive.setRGB(glow, glow * 0.85, glow * 0.4);
  drawLCD(glow);
  // camera distance along current orbit direction
  const dir = camera.position.clone().sub(controls.target).normalize();
  const aspectFix = Math.max(1, 1.25 / camera.aspect);
  camera.position.copy(controls.target).addScaledVector(dir, dist * userZoom * aspectFix);
  // caption
  let ph = PHASES[0]; for (const q of PHASES) if (t >= q[0]) ph = q;
  const key = ph[1] + ph[2]; if (key !== lastPhase) { lastPhase = key; phaseEl.innerHTML = `<b>${ph[1]}</b>${ph[2]}`; }
}

/* ---------------- UI ---------------- */
let playing = true, speed = 1, T = 0, scrubbing = false;
const scrub = document.getElementById('scrub'), playBtn = document.getElementById('play');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; playBtn.classList.toggle('on', playing); };
scrub.addEventListener('input', () => { T = scrub.value / 1000 * L; scrubbing = true; });
scrub.addEventListener('change', () => { scrubbing = false; });
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  speed = +b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const params = new URLSearchParams(location.search);
if (params.has('t')) { T = +params.get('t'); playing = false; }

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && !scrubbing) T = (T + dt * speed) % L;
  if (!scrubbing) scrub.value = Math.round(T / L * 1000);
  controls.update();
  apply(T);
  doHover();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.__ready = true;
</script>
</body>
